plugins {
    id 'com.android.application'
}

layout.buildDirectory = rootProject.layout.buildDirectory.dir('app')

android {
    namespace = 'house.indie.legacy'
    compileSdk = 35
    buildToolsVersion = '36.0.0'

    defaultConfig {
        applicationId = 'house.indie.legacy'
        minSdk = 18
        //noinspection ExpiredTargetSdkVersion
        targetSdk = 18
        versionCode = 11 // Keep these values in sync with AndroidManifest.xml for build.sh.
        versionName = '0.11'
    }

    sourceSets {
        main {
            manifest.srcFile '../AndroidManifest.xml'
            java.srcDirs = ['../src']
            res.srcDirs = ['../res']
            assets.srcDirs = ['../assets']
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    signingConfigs {
        legacyDebug {
            storeFile = rootProject.file('build/debug.keystore')
            storePassword = 'android'
            keyAlias = 'indiehouse'
            keyPassword = 'android'
            enableV1Signing = true
            enableV2Signing = false
        }
    }

    buildTypes {
        debug {
            // Use the same local key as build.sh so the APK upgrades existing installs.
            if (rootProject.file('build/debug.keystore').isFile()) {
                signingConfig = signingConfigs.legacyDebug
            }
        }
    }
}

dependencies {
    implementation files('../libs/zxing-core-3.3.2.jar')
}
